services:
  postgres:
    image: postgres:16-alpine
    container_name: auditorium-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: auditorium
      POSTGRES_PASSWORD: auditorium
      POSTGRES_DB: auditorium
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditorium -d auditorium"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
